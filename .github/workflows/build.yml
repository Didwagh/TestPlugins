name: Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and deploy plugins
        run: |
          chmod +x gradlew
          ./gradlew deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}